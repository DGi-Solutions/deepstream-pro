<!doctype html><html><head><meta charset="utf-8"><script src="../../native/deepstreamTheme.js"></script></head><body><div class="card-hoverable"><div class="cardScalable"><div id="cover" class="cardImageContainer" style="background-image:linear-gradient(red,blue)"></div><div id="overlay" class="cardOverlayContainer"><a id="hit" class="cardImageContainer" href="#cover"></a><button id="play">Play</button></div></div></div><output id="result">PENDING</output><script>window.addEventListener('DOMContentLoaded',()=>{const cover=getComputedStyle(document.querySelector('#cover'));const hit=getComputedStyle(document.querySelector('#hit'));const overlay=getComputedStyle(document.querySelector('#overlay'));let clicks=0;document.querySelector('#play').onclick=()=>clicks++;document.querySelector('#play').click();const ok=cover.backgroundImage.includes('gradient')&&hit.backgroundColor==='rgba(0, 0, 0, 0)'&&hit.boxShadow==='none'&&overlay.backgroundColor==='rgba(0, 0, 0, 0.28)'&&clicks===1;document.querySelector('#result').textContent=JSON.stringify({ok,cover:cover.backgroundImage,hit:hit.backgroundColor,overlay:overlay.backgroundColor,clicks});});</script></body></html>
